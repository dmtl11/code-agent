[project]
name = "code-agent-harness"
version = "0.1.0"
description = "A small coding-agent harness demo with local file and command tools."
requires-python = ">=3.10"

[project.scripts]
code-agent = "code_agent.cli:main"
code-agent-eval = "code_agent.eval:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
