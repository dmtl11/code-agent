<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header>
      <h1>🐍 贪吃蛇</h1>
      <p class="subtitle">方向键 / WASD 控制，吃到食物变长</p>
    </header>

    <main class="layout">
      <section class="game-panel">
        <div class="hud">
          <div class="stat">得分 <span id="score">0</span></div>
          <div class="stat">最高 <span id="best">0</span></div>
          <button id="aiToggle" type="button" title="开启/关闭 AI 自动模式">🤖 AI 模式</button>
          <button id="restartBtn" type="button">重新开始</button>
        </div>
        <div class="board-wrap">
          <canvas id="board" width="400" height="400"></canvas>
          <div id="overlay" class="overlay hidden">
            <div class="overlay-box">
              <h2 id="overlayTitle">游戏结束</h2>
              <p id="overlayMsg"></p>
              <button id="overlayBtn" type="button">再来一局</button>
            </div>
          </div>
        </div>
      </section>

      <aside class="side-panel">
        <h2>排行榜</h2>
        <ol id="leaderboard" class="leaderboard">
          <li class="empty">暂无记录</li>
        </ol>
        <p class="hint">游戏结束后输入昵称即可上榜</p>
      </aside>
    </main>

    <footer>
      <p>纯前端 + Python 标准库后端 · SQLite 存储</p>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
